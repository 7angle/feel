name: Android release

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Apps/FeelAndroid
    env:
      VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/feel-release.jks"
      - name: Build release APK
        env:
          FEEL_KEYSTORE: ${{ runner.temp }}/feel-release.jks
          FEEL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FEEL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FEEL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VN="${VERSION_NAME#android-v}"
          ./gradlew --no-daemon assembleRelease -PversionName="$VN"
      - name: Name the APK
        run: |
          VN="${VERSION_NAME#android-v}"
          cp app/build/outputs/apk/release/app-release.apk "feel-android-$VN.apk"
          sha256sum "feel-android-$VN.apk" > "feel-android-$VN.apk.sha256"
      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Apps/FeelAndroid/feel-android-*.apk
            Apps/FeelAndroid/feel-android-*.apk.sha256
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: feel-android
          path: Apps/FeelAndroid/feel-android-*.apk
